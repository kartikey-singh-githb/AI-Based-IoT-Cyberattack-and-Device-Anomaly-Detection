server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so deep links (/devices, /alerts, ...) work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container (compose service name).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Prometheus scrapes the backend directly on the compose network;
    # expose it through nginx for host-side scraping if desired.
    location /metrics {
        proxy_pass http://backend:8000/metrics;
    }
}
